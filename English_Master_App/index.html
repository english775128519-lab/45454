<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b36">
<title>English Master | تعلّم الإنجليزية</title>
<style>
:root{--bg:#0b1226;--panel:#121e39;--panel2:#182746;--line:#2a3a5c;--text:#f4f7ff;--muted:#aab8d2;--mint:#54e0bd;--blue:#78a9ff;--gold:#ffc96b;--red:#ff7c89;--shadow:0 18px 45px #03081770}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#1b3760 0,transparent 34%),linear-gradient(145deg,#0a1124,#101a32 55%,#0b1429);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--mint),#5a9cff);display:grid;place-items:center;color:#092036;font-weight:1000;font-size:23px;box-shadow:0 8px 25px #54e0bd35}.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}.topstats{display:flex;gap:9px;flex-wrap:wrap}.pill{background:#172744;border:1px solid var(--line);padding:9px 13px;border-radius:30px;font-size:13px;color:#e7efff}.pill b{color:var(--gold)}
.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.side,.maincard,.card{background:linear-gradient(160deg,#152341ed,#101b34f5);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.side{padding:15px;height:max-content;position:sticky;top:12px}.nav{display:grid;gap:7px}.nav button{padding:12px 13px;border-radius:13px;background:transparent;color:var(--muted);text-align:right;display:flex;align-items:center;gap:10px}.nav button.active,.nav button:hover{background:#24395d;color:white}.nav .ico{width:24px;text-align:center;font-size:18px}.sidefoot{border-top:1px solid var(--line);margin-top:15px;padding:14px 5px 3px;color:var(--muted);font-size:12px;line-height:1.7}
.maincard{padding:22px;min-height:690px}.hero{padding:23px;border-radius:20px;background:linear-gradient(115deg,#1e4163,#193052 55%,#1b2c50);border:1px solid #416188;display:flex;justify-content:space-between;align-items:center;gap:15px;overflow:hidden}.hero h2{font-size:clamp(22px,4vw,34px);margin:0 0 7px}.hero p{margin:0;color:#d4e2f6}.hero .mascot{font-size:58px;filter:drop-shadow(0 9px 10px #0005)}.btn{padding:11px 17px;border-radius:12px;background:linear-gradient(135deg,var(--mint),#66c8ff);color:#071c2b;font-weight:800}.btn.secondary{background:#253a5d;color:#eaf1ff;border:1px solid #40577b}.btn.gold{background:linear-gradient(135deg,#ffdb8a,#ffb94d);color:#392507}.btn:disabled{opacity:.4;cursor:not-allowed}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}.sectionhead h3{margin:0;font-size:18px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,.lesson,.game,.feature{padding:16px;border:1px solid var(--line);border-radius:17px;background:#172642}.stat strong{font-size:25px;display:block;margin:4px 0;color:var(--mint)}.stat span{color:var(--muted);font-size:13px}.lesson,.game,.feature{cursor:pointer;transition:.2s}.lesson:hover,.game:hover,.feature:hover{transform:translateY(-3px);border-color:#6b91c6}.lesson .num{font-size:12px;color:var(--mint)}.lesson h4,.game h4{margin:8px 0}.lesson p,.game p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.progress{height:8px;border-radius:9px;background:#293b5c;overflow:hidden;margin-top:13px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:9px;width:0}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.pagehead h2{margin:0}.back{background:#243a5e;color:#eaf2ff;padding:9px 13px;border-radius:10px}.contentbox{background:#172642;border:1px solid var(--line);border-radius:18px;padding:19px;margin-bottom:14px}.word{font-size:clamp(30px,6vw,48px);direction:ltr;text-align:center;color:var(--mint);font-weight:900;margin:12px}.translation{text-align:center;font-size:20px}.pron{text-align:center;color:var(--gold);margin:8px}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:15px 0}.optionlist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.option{padding:13px;border-radius:12px;background:#22385b;color:white;border:1px solid #3b5277;text-align:center}.option.correct{background:#145b4b;border-color:var(--mint)}.option.wrong{background:#642d42;border-color:var(--red)}.feedback{padding:12px;border-radius:12px;margin-top:13px;background:#203453;color:#dce9ff}.field{width:100%;background:#0c1830;border:1px solid #354a70;border-radius:12px;padding:13px;color:white;outline:none}.field:focus{border-color:var(--mint)}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.chatlog{height:330px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px;background:#0e1a31;border-radius:15px;margin-bottom:12px}.bubble{max-width:85%;padding:11px 14px;border-radius:15px;line-height:1.6}.bubble.teacher{align-self:flex-start;background:#233b60}.bubble.student{align-self:flex-end;background:#145646}.bubble small{display:block;color:#b7c7e1;font-size:11px;margin-bottom:4px}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#253c60;color:#d7e8ff;font-size:12px;margin:3px}.list{line-height:2.1}.empty{text-align:center;padding:40px 10px;color:var(--muted)}.search{margin-bottom:12px}.wordrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}.wordrow b{direction:ltr;display:block}.wordrow small{color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e3fff7;color:#07362b;padding:12px 18px;border-radius:13px;box-shadow:var(--shadow);font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1}.footer{text-align:center;color:#8293b2;font-size:11px;margin-top:20px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{position:static;padding:8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.sidefoot{display:none}.maincard{padding:14px;min-height:600px}.grid{grid-template-columns:repeat(2,1fr)}.hero{padding:18px}.top{align-items:flex-start}.topstats{justify-content:flex-end}.app{padding:12px}}
@media(max-width:460px){.grid{grid-template-columns:1fr 1fr}.hero .mascot{font-size:43px}.pill{font-size:11px;padding:7px 9px}.optionlist{grid-template-columns:1fr}.maincard{border-radius:16px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">EN</div><div><h1>ENGLISH MASTER</h1><small>تعلّم الإنجليزية خطوة بخطوة</small></div></div><div class="topstats"><div class="pill">⭐ <b id="xpTop">0</b> نقطة</div><div class="pill">🔥 <b id="streakTop">1</b> يوم</div></div></header>
<div class="layout"><aside class="side"><nav class="nav" id="nav">
<button class="active" data-page="home"><span class="ico">⌂</span> الرئيسية</button>
<button data-page="lessons"><span class="ico">📚</span> الدروس</button>
<button data-page="games"><span class="ico">🎮</span> الألعاب</button>
<button data-page="tutor"><span class="ico">🤖</span> المعلم الذكي</button>
<button data-page="dictionary"><span class="ico">📖</span> القاموس</button>
<button data-page="progress"><span class="ico">🏆</span> إنجازاتي</button>
</nav><div class="sidefoot">تعلم قليلًا كل يوم، وستلاحظ الفرق.<br>احفظ تقدمك على هذا الجهاز تلقائيًا.</div></aside>
<main class="maincard" id="view"></main></div><div class="footer">نسخة أولية تعمل محليًا على جهازك • الصوت يعتمد على دعم المتصفح</div></div><div class="toast" id="toast"></div>
<script>
const lessons=[
{id:1,title:"التحيات والتعارف",level:"البداية",desc:"ابدأ محادثتك الأولى باللغة الإنجليزية.",items:[
["Hello","مرحبًا","هَلّو"],["Good morning","صباح الخير","جود مورنينغ"],["Good evening","مساء الخير","جود إيفنينغ"],["How are you?","كيف حالك؟","هاو آر يو"],["I am fine","أنا بخير","آي آم فاين"],["What is your name?","ما اسمك؟","وات إز يور نيم"],["My name is Ali","اسمي علي","ماي نيم إز علي"],["Nice to meet you","سعيد بلقائك","نايس تو ميت يو"]]},
{id:2,title:"الضمائر والجمل الأساسية",level:"مبتدئ",desc:"تعرّف على الضمائر وبناء الجمل القصيرة.",items:[
["I","أنا","آي"],["You","أنتَ / أنتِ","يو"],["He","هو","هي"],["She","هي","شي"],["We","نحن","وي"],["They","هم","ذَي"],["I am a student","أنا طالب","آي آم أ ستودنت"],["You are my friend","أنت صديقي","يو آر ماي فريند"]]},
{id:3,title:"العائلة والأشخاص",level:"مبتدئ",desc:"مفردات أفراد الأسرة والأشخاص.",items:[
["Father","أب","فاذَر"],["Mother","أم","ماذَر"],["Son","ابن","سَن"],["Daughter","ابنة","دوتر"],["Husband","زوج","هَزبَند"],["Wife","زوجة","وايف"],["Friend","صديق","فريند"],["Neighbour","جار","نيبَر"]]},
{id:4,title:"في الشارع والاتجاهات",level:"أساسي",desc:"اسأل عن الطريق والأماكن في المدينة.",items:[
["Street","شارع","ستريت"],["Road","طريق","رود"],["Car","سيارة","كار"],["Bus","حافلة","بَس"],["Taxi","سيارة أجرة","تاكسي"],["Where is the bus station?","أين محطة الحافلات؟","وير إز ذا بَس ستيشن"],["I want to go home","أريد الذهاب إلى المنزل","آي وانت تو جو هوم"],["Turn right","انعطف يمينًا","تيرن رايت"]]},
{id:5,title:"المواصلات والسفر",level:"أساسي",desc:"كلمات السفر ووسائل النقل الواردة ضمن موضوعات الملزمة.",items:[
["Plane","طائرة","بلاين"],["Ship","سفينة","شِب"],["Boat","قارب","بوت"],["Train","قطار","ترين"],["Bicycle","دراجة","بايسكل"],["Pilot","طيار","بايلَت"],["Ticket","تذكرة","تيكِت"],["Waiting room","غرفة الانتظار","ويتينغ روم"]]},
{id:6,title:"الخدمات العامة",level:"أساسي",desc:"تعلم مفردات البريد والخدمات.",items:[
["Post office","مكتب البريد","بوست أوفِس"],["Letter","رسالة","لِتَر"],["Stamp","طابع بريدي","ستامب"],["Address","عنوان","أدرِس"],["Envelope","ظرف","إنفِلوب"],["Hospital","مستشفى","هوسبيتل"],["Police station","مركز الشرطة","بوليس ستيشن"],["Doctor","طبيب","دوكتر"]]}
];
const state=JSON.parse(localStorage.getItem("em_state")||'{"xp":0,"done":[],"wrong":[],"favs":[],"streak":1,"last":"","best":0}');
let page="home",currentLesson=1,quizIndex=0,quizScore=0,quizPool=[],chatCount=0;
const $=s=>document.querySelector(s);
function save(){localStorage.setItem("em_state",JSON.stringify(state));$("#xpTop").textContent=state.xp;$("#streakTop").textContent=state.streak}
function toast(s){let t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function go(p){page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
function speak(t){if(!("speechSynthesis"in window)){toast("الصوت غير مدعوم في هذا المتصفح");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}
function addXP(n){state.xp+=n;save()}
function render(){save();let v=$("#view");
if(page==="home"){let done=state.done.length,total=lessons.length,percent=Math.round(done/total*100);v.innerHTML=`<section class="hero"><div><span class="tag">رحلتك تبدأ الآن</span><h2>مرحبًا بك في عالم الإنجليزية 👋</h2><p>تعلّم، استمع، العب، وتدرّب كل يوم.</p><div style="margin-top:16px"><button class="btn" onclick="openLesson(${lessons.find(l=>!state.done.includes(l.id))?.id||1})">ابدأ التعلم ←</button></div></div><div class="mascot">🧑‍🏫</div></section>
<div class="sectionhead"><h3>ملخص رحلتك</h3><span class="muted">استمر، أنت تستطيع</span></div><div class="grid"><div class="stat"><strong>${state.xp}</strong><span>نقاطك</span></div><div class="stat"><strong>${done}/${total}</strong><span>دروس مكتملة</span></div><div class="stat"><strong>${percent}%</strong><span>نسبة الإنجاز</span></div></div>
<div class="sectionhead"><h3>تابع التقدم</h3><span class="muted">${percent}%</span></div><div class="progress"><i style="width:${percent}%"></i></div>
<div class="sectionhead"><h3>مسارات التعلم</h3><button class="back" onclick="go('lessons')">كل الدروس</button></div><div class="grid">${lessons.slice(0,3).map(l=>lessonCard(l)).join("")}</div>
<div class="sectionhead"><h3>تدرّب الآن</h3></div><div class="grid"><div class="feature" onclick="go('games')">🎮 <b>الألعاب التعليمية</b><p class="muted">اختبر ذاكرتك ومفرداتك.</p></div><div class="feature" onclick="go('tutor')">🤖 <b>المعلم التفاعلي</b><p class="muted">تحدث وتدرّب مع المعلم.</p></div><div class="feature" onclick="go('dictionary')">📖 <b>القاموس</b><p class="muted">ابحث عن كلمة واستمع لها.</p></div></div>`}
else if(page==="lessons"){v.innerHTML=`<div class="pagehead"><h2>📚 الدروس التعليمية</h2><span class="tag">${lessons.length} وحدات تجريبية</span></div><p class="muted">اختر درسًا، اقرأ الشرح، استمع إلى الكلمات، ثم اختبر نفسك.</p><div class="grid">${lessons.map(l=>lessonCard(l)).join("")}</div><div class="feedback">تنبيه: هذه النسخة الأولى تحتوي على عينة منظمة من موضوعات الملزمة، وليست تفريغًا كاملًا لكل صفحات PDF بعد.</div>`}
else if(page==="games"){v.innerHTML=`<div class="pagehead"><h2>🎮 ساحة الألعاب</h2><span class="tag">اكسب نقاطًا بالتدريب</span></div><div class="grid"><div class="game" onclick="startQuiz('meaning')"><div style="font-size:30px">🧠</div><h4>اختر المعنى الصحيح</h4><p>اقرأ الكلمة الإنجليزية واختر ترجمتها.</p></div><div class="game" onclick="startQuiz('english')"><div style="font-size:30px">🔤</div><h4>اختر الكلمة الإنجليزية</h4><p>شاهد المعنى واختر الكلمة المناسبة.</p></div><div class="game" onclick="startQuiz('listen')"><div style="font-size:30px">🎧</div><h4>استمع واختر</h4><p>استمع إلى النطق ثم اختر المعنى.</p></div><div class="game" onclick="startQuiz('sentence')"><div style="font-size:30px">💬</div><h4>تحدي الجمل</h4><p>تدرّب على جمل يومية قصيرة.</p></div></div><div id="gameArea"></div>`}
else if(page==="tutor"){v.innerHTML=`<div class="pagehead"><h2>🤖 المعلم التفاعلي</h2><span class="tag">تدريب صوتي ونصي</span></div><div class="contentbox"><h3 style="margin-top:0">أهلًا بك! أنا معلمك الافتراضي.</h3><p class="muted">اكتب جملة بالإنجليزية أو ابدأ محادثة. أستطيع في هذه النسخة تقديم تدريب وإجابات تعليمية أساسية دون اتصال بخدمة ذكاء اصطناعي خارجية.</p><div class="actions"><button class="btn secondary" onclick="speak('Hello! How are you today?')">🔊 استمع لسؤال المعلم</button><button class="btn secondary" onclick="startVoice()">🎙️ تحدث</button></div></div><div class="chatlog" id="chatlog"><div class="bubble teacher"><small>المعلم</small>Hello! How are you today?<br>مرحبًا! كيف حالك اليوم؟</div></div><div class="row"><input class="field" id="chatInput" placeholder="اكتب إجابتك بالإنجليزية..."><button class="btn" onclick="sendChat()">إرسال</button></div><div class="feedback">جرّب: My name is Ali / I am fine / Thank you / What is your name?</div>`}
else if(page==="dictionary"){let all=allWords();v.innerHTML=`<div class="pagehead"><h2>📖 قاموس الكلمات</h2><span class="tag">${all.length} كلمة وجملة</span></div><input class="field search" id="dictSearch" placeholder="ابحث بالإنجليزية أو العربية..." oninput="filterDict()"><div id="dictList">${dictRows(all)}</div>`}
else if(page==="progress"){let done=state.done.length;v.innerHTML=`<div class="pagehead"><h2>🏆 إنجازاتي</h2><span class="tag">واصل التقدم!</span></div><div class="grid"><div class="stat"><strong>${state.xp}</strong><span>إجمالي النقاط</span></div><div class="stat"><strong>${done}</strong><span>دروس مكتملة</span></div><div class="stat"><strong>${state.favs.length}</strong><span>كلمات مفضلة</span></div></div><div class="sectionhead"><h3>الدروس المكتملة</h3></div>${done?lessons.filter(l=>state.done.includes(l.id)).map(l=>`<div class="wordrow"><span>✅ ${l.title}</span><small>مكتمل</small></div>`).join(""):'<div class="empty">لم تكمل أي درس بعد. ابدأ بأول درس! 🌟</div>'}<div class="sectionhead"><h3>الأخطاء للمراجعة</h3></div>${state.wrong.length?state.wrong.slice(-10).map(w=>`<div class="wordrow"><span><b>${w.en}</b><small>${w.ar}</small></span><button class="back" onclick="speak('${w.en.replace(/'/g,"")}')">استمع</button></div>`).join(""):'<p class="muted">رائع! لا توجد أخطاء محفوظة للمراجعة حتى الآن.</p>'}<div class="actions"><button class="btn secondary" onclick="if(confirm('هل تريد تصفير التقدم؟')){localStorage.removeItem('em_state');location.reload()}">إعادة ضبط التقدم</button></div>`}
}
function lessonCard(l){let d=state.done.includes(l.id);return `<div class="lesson" onclick="openLesson(${l.id})"><span class="num">الوحدة ${l.id} • ${l.level}</span><h4>${l.title} ${d?'✅':''}</h4><p>${l.desc}</p><div class="progress"><i style="width:${d?100:0}%"></i></div></div>`}
function openLesson(id){currentLesson=id;page="lesson";renderLesson()}
function renderLesson(){let l=lessons.find(x=>x.id===currentLesson),v=$("#view");v.innerHTML=`<div class="pagehead"><h2>${l.title}</h2><button class="back" onclick="go('lessons')">رجوع للدروس</button></div><p class="muted">${l.desc}</p><div class="contentbox"><h3>مفردات وجمل الدرس</h3>${l.items.map((it,i)=>`<div class="wordrow"><div><b>${it[0]}</b><small>${it[1]} • النطق التقريبي: ${it[2]}</small></div><div style="display:flex;gap:6px"><button class="back" onclick="speak('${it[0].replace(/'/g,"")}')">🔊</button><button class="back" onclick="toggleFav('${it[0]}','${it[1]}')">☆</button></div></div>`).join("")}</div><div class="contentbox"><h3>تدرّب على النطق</h3><p class="muted">استمع إلى الجملة ثم كررها بصوتك.</p><div class="actions"><button class="btn" onclick="speak('${l.items[0][0]}')">🔊 استمع</button><button class="btn secondary" onclick="startVoice()">🎙️ سجّل صوتك</button></div><div id="voiceResult" class="muted" style="text-align:center"></div></div><div class="actions"><button class="btn gold" onclick="startLessonQuiz(${l.id})">اختبر نفسك في الدرس</button><button class="btn secondary" onclick="completeLesson(${l.id})">وضع علامة مكتمل</button></div>`}
function completeLesson(id){if(!state.done.includes(id)){state.done.push(id);addXP(30);toast("أحسنت! حصلت على 30 نقطة ⭐")}else toast("هذا الدرس مكتمل بالفعل");renderLesson()}
function toggleFav(en,ar){let i=state.favs.findIndex(x=>x.en===en);if(i>=0)state.favs.splice(i,1);else state.favs.push({en,ar});save();toast(i>=0?"أزيلت من المفضلة":"أضيفت إلى المفضلة ⭐")}
function allWords(){return lessons.flatMap(l=>l.items.map(x=>({en:x[0],ar:x[1],pron:x[2]})))}
function dictRows(a){return a.map(x=>`<div class="wordrow"><span><b>${x.en}</b><small>${x.ar} ${x.pron?' • '+x.pron:''}</small></span><button class="back" onclick="speak('${x.en.replace(/'/g,"")}')">🔊</button></div>`).join("")||'<div class="empty">لا توجد نتائج.</div>'}
function filterDict(){let q=$("#dictSearch").value.toLowerCase();$("#dictList").innerHTML=dictRows(allWords().filter(x=>x.en.toLowerCase().includes(q)||x.ar.includes(q)))}
function startQuiz(mode,lessonId=null){quizPool=lessonId?lessons.find(l=>l.id===lessonId).items:allWords().map(x=>[x.en,x.ar,x.pron]);quizPool=[...quizPool].sort(()=>Math.random()-.5).slice(0,Math.min(6,quizPool.length));quizIndex=0;quizScore=0;page="quiz";renderQuiz(mode,lessonId)}
function startLessonQuiz(id){startQuiz("meaning",id)}
function renderQuiz(mode,lessonId){let v=$("#view");if(quizIndex>=quizPool.length){let pts=quizScore*10;addXP(pts);v.innerHTML=`<div class="empty"><div style="font-size:55px">🏆</div><h2>انتهى التحدي!</h2><p>نتيجتك: ${quizScore} من ${quizPool.length}</p><p>حصلت على ${pts} نقطة.</p><button class="btn" onclick="${lessonId?'openLesson('+lessonId+')':"go('games')"}">متابعة</button></div>`;return}
let item=quizPool[quizIndex],question=mode==="english"?item[1]:item[0],correct=mode==="english"?item[0]:item[1];if(mode==="listen")question="استمع إلى الكلمة ثم اختر معناها";if(mode==="sentence"){question=item[0].includes(" ")?item[0]:"استخدم كلمة: "+item[0];}
let pool=allWords().filter(x=>x.ar!==item[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>mode==="english"?x.en:x.ar);let opts=[correct,...pool].sort(()=>Math.random()-.5);
v.innerHTML=`<div class="pagehead"><h2>🎯 تحدي ${mode==="english"?"الكلمة":mode==="listen"?"الاستماع":mode==="sentence"?"الجمل":"المعنى"}</h2><span class="tag">${quizIndex+1} / ${quizPool.length}</span></div><div class="progress"><i style="width:${quizIndex/quizPool.length*100}%"></i></div><div class="contentbox" style="margin-top:18px"><p class="muted" style="text-align:center">اختر الإجابة الصحيحة</p>${mode==="listen"?`<div class="actions"><button class="btn" onclick="speak('${item[0].replace(/'/g,"")}')">🔊 استمع للكلمة</button></div>`:`<div class="word">${question}</div>`}${mode==="listen"?`<div class="translation">ما معنى الكلمة؟</div>`:""}<div class="optionlist">${opts.map(o=>`<button class="option" onclick="answerQuiz(this,'${encodeURIComponent(o)}','${encodeURIComponent(correct)}','${encodeURIComponent(item[0])}','${encodeURIComponent(item[1])}',${mode},${lessonId||0})">${o}</button>`).join("")}</div><div id="quizFeedback"></div></div>`}
function answerQuiz(btn,choice,correct,en,ar,mode,lessonId){let buttons=[...document.querySelectorAll(".option")];buttons.forEach(b=>b.disabled=true);let ok=decodeURIComponent(choice)===decodeURIComponent(correct);btn.classList.add(ok?"correct":"wrong");if(ok){quizScore++;$("#quizFeedback").innerHTML='<div class="feedback">إجابة صحيحة! ممتاز 👏</div>'}else{$("#quizFeedback").innerHTML=`<div class="feedback">الإجابة الصحيحة: <b>${decodeURIComponent(correct)}</b>. سنضيفها إلى قائمة المراجعة.</div>`;state.wrong.push({en:decodeURIComponent(en),ar:decodeURIComponent(ar)})}setTimeout(()=>{quizIndex++;renderQuiz(mode,lessonId||null)},1050)}
function sendChat(){let input=$("#chatInput"),s=input.value.trim();if(!s)return;let log=$("#chatlog");log.innerHTML+=`<div class="bubble student"><small>أنت</small>${escapeHTML(s)}</div>`;input.value="";let r=reply(s);log.innerHTML+=`<div class="bubble teacher"><small>المعلم</small>${r}</div>`;log.scrollTop=log.scrollHeight;chatCount++;if(chatCount%3===0)addXP(5)}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function reply(s){let t=s.toLowerCase();if(t.includes("hello")||t.includes("hi"))return "Hello! Nice to meet you. 😊<br>مرحبًا! سعيد بلقائك. قل: <b>My name is ...</b>";if(t.includes("fine")||t.includes("good"))return "Great! You can say: <b>I am fine, thank you.</b><br>ممتاز! أضف thank you للشكر.";if(t.includes("name"))return "You can answer: <b>My name is Ali.</b><br>يمكنك استبدال Ali باسمك.";if(t.includes("thank"))return "You're welcome! معناها: على الرحب والسعة.";if(t.includes("where"))return "Good question! Try: <b>Where is the bus station?</b><br>أين محطة الحافلات؟";if(t.includes("help")||t.includes("اشرح"))return "بكل سرور. اكتب الكلمة أو الجملة التي تريد شرحها، وسأساعدك بمثال بسيط.";return "Good try! 👏 حاول كتابة جملة قصيرة مثل: <b>I am a student.</b><br>أنا طالب. ويمكنك الضغط على زر الصوت لسماع النطق."}
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("التعرف على الصوت غير مدعوم هنا. جرّب Chrome.");return}let rec=new SR();rec.lang="en-US";rec.interimResults=false;rec.onresult=e=>{let s=e.results[0][0].transcript;if($("#chatInput")){$("#chatInput").value=s;sendChat()}else if($("#voiceResult"))$("#voiceResult").textContent="سمعنا: "+s};rec.onerror=()=>toast("تعذر التقاط الصوت. تحقق من إذن الميكروفون.");rec.start();toast("تحدث الآن بالإنجليزية...")}
function startLessonQuiz(id){startQuiz("meaning",id)}
$("#xpTop").textContent=state.xp;$("#streakTop").textContent=state.streak;render();
</script></body></html>
